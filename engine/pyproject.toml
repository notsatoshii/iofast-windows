[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iofast-engine"
# Must equal the repo-root VERSION file (iofast.spec refuses to freeze otherwise,
# tests/test_version_sync.py fails). Bump list: docs/RELEASING.md.
version = "0.2.8"
description = "Crawl a documentation site into hyphen-named markdown files."
# 3.14 is untested by scrapling/playwright upstream — do not admit it.
requires-python = ">=3.13,<3.14"
dependencies = [
    # [fetchers] is where Fetcher/Spider/AsyncDynamicSession live; the bare package is
    # the parser core only and cannot import scrapling.spiders (needs anyio, curl_cffi).
    "scrapling[fetchers]==0.4.2",
    "trafilatura==2.2.0",
    "markdownify==1.2.2",
    "patchright==1.58.2",
    "cssselect==1.4.0",
    "lxml==6.1.1",
    # YouTube transcript/metadata extraction (sources/youtube.py). Unlicense — compatible.
    "yt-dlp>=2024.1.0",
    # Public social endpoints (sources/social_public.py) and watch/checker.py.
    "httpx>=0.27.0",
    # Local speech-to-text fallback when YouTube has no manual captions.
    # MIT license. Ships ctranslate2 (CPU); CUDA wheels are an optional extra.
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "playwright==1.58.0"]
gpu = [
    # CUDA runtime libs for faster-whisper on NVIDIA GPUs. Install with:
    #   pip install iofast-engine[gpu]
    # or standalone: pip install nvidia-cublas-cu12 nvidia-cudnn-cu12
    "nvidia-cublas-cu12>=12.0",
    "nvidia-cudnn-cu12>=9.0",
]
build = [
    "pyinstaller==6.16.0",
    # iofast.spec collect_data_files()s these two; both otherwise arrive only
    # transitively via scrapling[fetchers]. Declared bare on purpose: the
    # declaration is the point, and an == pin here can deadlock against a
    # future scrapling range (ResolutionImpossible kills CI at pip install).
    "browserforge",
    "apify-fingerprint-datapoints",
]

[project.scripts]
iofast = "iofast_engine.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/iofast_engine"]
