[package]
name = "iofast"
version = "0.1.0"
description = "iofast desktop shell"
edition = "2021"
rust-version = "1.77.2"

# Cargo.lock IS load-bearing here — commit it. The lockfile was resolved under
# cargo 1.78 (no MSRV-aware resolver), pinning back transitive crates that need
# rustc 1.81-1.85; the toolchain is now 1.97.1 (rust-toolchain.toml, D2
# 2026-08-12) and builds this lockfile unchanged. A future `cargo update` may
# raise transitive floors — that is fine now, but keep the lockfile committed.
#
# tauri-plugin-opener drags a Linux-only zbus/zvariant subtree that resolves to
# edition2024 crates. They are never fetched or compiled for macOS/Windows, so
# no pin is needed — but `cargo fetch` (which downloads EVERY target's graph)
# fails on them, as it already did on this lock via tao -> dlopen2 0.8.2.
# Use `cargo build`/`cargo test`; a Linux build needs a newer cargo.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# sync only: the oneshot that correlates a JSON-RPC reply to its request.
tokio = { version = "1", features = ["sync"] }
# Move-to-Trash for library deletes (NSFileManager trashItemAtURL — reversible,
# no Finder automation prompt). Pinned to 3.x: trash 5 declares rust-version
# 1.85. Never `rm -rf` a user's library.
trash = "3"

[target.'cfg(windows)'.dependencies]
# Win32 clipboard API for reading text without a crate that pulls image deps.
windows-sys = { version = "0.59", features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security_Credentials",
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }
# High-level `windows` crate for COM UI Automation (VARIANT, IUIAutomation,
# IUIAutomationElementArray, SysFreeString — missing from windows-sys 0.59).
# Used only for active_browser_url(); everything else stays on windows-sys.
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
