name: release

# Structure only: builds the UNSIGNED app bundle on a version tag. Signing and
# notarization are deferred by decision (PLAN.md Phase 4) — no secrets, no
# codesign, no notarytool. Turning them on is config, not surgery: fill in the
# commented env block below and add the four secrets. Because it triggers on
# tags and manual dispatch only, normal pushes and PRs never run it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One release build at a time, across ALL refs: a dispatch racing a tag push
# (different refs, so a ref-keyed group would run both) must not run two
# 10x-billed macOS jobs to completion; the newest wins.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    # macOS minutes bill at 10x. Without a timeout, one hung job on the default
    # 6h limit bills up to 3,600 min — 1.8x the monthly allowance — from a
    # single tag push. 45 min is ~2x the measured full build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # iofast.spec + build.rs stamp `git log -1 -- engine/…`; a shallow clone breaks it

      # 1. Freeze the Python sidecar and verify it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "engine[dev,build]"
      - run: pyinstaller --noconfirm packaging/iofast.spec
        working-directory: engine
      - run: python packaging/verify_frozen.py dist/iofast/iofast
        working-directory: engine
      # The freeze above must run BEFORE the Tauri build: tauri.conf.json's
      # bundle.resources maps engine/dist/iofast/ into the bundle at
      # Resources/engine/, where sidecar.rs resolves it in release builds.

      # 2. Install the toolchain app/src-tauri/rust-toolchain.toml pins (1.97.1).
      # The toml wins over any version passed here, so match it — a stale pin
      # is dead weight with a misleading comment.
      - uses: dtolnay/rust-toolchain@1.97.1

      # 3. Build the Tauri bundle. pnpm 9.15.2 + node 22 to match local dev.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # Unsigned build. Tauri does NOT codesign unless APPLE_SIGNING_IDENTITY is set,
      # so this runs green today with no secrets. To turn signing + notarization on,
      # uncomment the env block below and add the secrets in repo settings — no other
      # change to this step is needed (tauri.conf.json macOS.hardenedRuntime and
      # macOS.entitlements already point at the entitlements file):
      #   env:
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}   # app-specific password
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: pnpm tauri build
        working-directory: app

      # 4. Keep the unsigned bundle as a build artifact (not a public release).
      - uses: actions/upload-artifact@v4
        with:
          name: iofast-macos-unsigned
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

  # Unsigned NSIS installer for the Windows app. tauri.conf.json targets "all",
  # which on Windows includes NSIS; only NSIS is built here. Windows bills 2x.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # iofast.spec + build.rs stamp `git log -1 -- engine/...`; a shallow clone breaks it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "engine[dev,build]"
      # Must run BEFORE the Tauri build: bundle.resources copies engine/dist/iofast/.
      - run: ./scripts/windows/freeze.ps1 -Python (Get-Command python).Source -NoSync
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm tauri build --bundles nsis
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: iofast-windows-unsigned
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
