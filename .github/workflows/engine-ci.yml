name: engine-ci

# The suite is offline by design: committed fixtures stand in for the live web,
# so CI installs no browsers and makes no network requests.
#
# COST. This repo is private, so every minute here comes out of the account's
# 2,000 included Actions minutes. In August 2026 a macOS frozen-sidecar job here
# burned 93% of them proving a mac binary nobody ships. It is gone: the frozen
# Windows sidecar, cargo test and the frontend build run in windows-ci.yml
# (pull requests only), and the phone app in android-ci.yml. This file keeps
# only the cheap Linux suite, on pull requests and on main.
#
# test_version_sync.py reads the app and android version files, so they are in
# the paths below.
on:
  push:
    # main only. A branch push is already covered by its PR.
    branches: [main]
    paths:
      - "engine/**"
      - "VERSION"
      - "app/package.json"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/tauri.conf.json"
      - "android/app/build.gradle.kts"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - "VERSION"
      - "app/package.json"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/tauri.conf.json"
      - "android/app/build.gradle.kts"
      - ".github/workflows/engine-ci.yml"

# One live run per ref. A new push to a PR cancels the run it supersedes instead
# of paying for a result nobody will read. main is deliberately NOT cancellable:
# two merges landing close together must each leave a real result behind, and
# the Linux suite is cheap enough that racing it costs nothing worth saving.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e "engine[dev]"
      - run: pytest engine/tests -q
