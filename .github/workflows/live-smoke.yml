name: live-smoke

# PLAN CI tier (b): scheduled REPORT-ONLY live run. Fixtures gate merges;
# this watches for live drift. It never blocks anything — failure opens an
# issue instead. Small on purpose: 3 platforms x 5 pages, politeness intact.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e engine
      - name: Live smoke (report-only)
        id: smoke
        continue-on-error: true
        run: |
          set +e
          fails=""
          for url in \
            "https://docs.gitbook.com/" \
            "https://docs.readthedocs.com/platform/en/stable/" \
            "https://mintlify.com/docs" ; do
            echo "::group::$url"
            iofast scrape "$url" --max-pages 5 --out "/tmp/smoke-$(echo "$url" | tr -c 'a-z0-9' '-')"
            code=$?
            echo "exit $code for $url"
            [ "$code" -ne 0 ] && fails="$fails$url (exit $code)\n"
            echo "::endgroup::"
          done
          if [ -n "$fails" ]; then
            printf "failures<<EOF\n%b\nEOF\n" "$fails" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Open drift issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const failures = `${{ steps.smoke.outputs.failures }}`;
            const title = "live-smoke: platform drift detected";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "live-smoke",
            });
            const body = "Scheduled live smoke failed (report-only, merges unaffected).\n\n" +
              "```\n" + failures + "```\n" +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["live-smoke"],
              });
            }
